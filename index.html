<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Seas Trader v2.6</title>

<style>
body{margin:0;font-family:Arial;background:#0b0f1a;color:#e5e7eb}
.container{max-width:1150px;margin:auto;padding:20px}
h1{text-align:center;color:#38bdf8}
.version{text-align:center;color:#94a3b8;margin-bottom:20px}

.card{background:#111827;border-radius:14px;padding:20px;margin-bottom:20px}
h2{color:#facc15}

button,select,input{
width:100%;padding:10px;border-radius:10px;
border:1px solid #1f2937;background:#020617;
color:#e5e7eb;font-size:15px;margin-bottom:8px
}
button{background:#38bdf8;color:#020617;font-weight:bold;cursor:pointer}

.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.priceTab p{padding:10px;border-bottom:1px solid #1f2937}

.slot{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.editorRow{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-bottom:6px}

.tradebar{width:100%;height:18px;border-radius:10px;background:#020617;overflow:hidden;margin:12px 0}
.tradebar-inner{height:100%;width:50%;background:#facc15;transition:.4s}

.result{text-align:center;font-size:20px;font-weight:bold}
.ok{color:#22c55e}
.under{color:#ef4444}
.fair{color:#facc15}
</style>
</head>

<body>
<div class="container">
<h1>⚙️ Robot Seas — Trader</h1>
<div class="version">Versão 2.6v</div>

<!-- ================= VALORES ================= -->
<div class="card">
<h2>💰 Valores</h2>

<div class="tabs">
<button onclick="showTab('frutas')">🍎 Frutas</button>
<button onclick="showTab('perm')">⭐ Perm</button>
<button onclick="showTab('gamepass')">🎮 Gamepass</button>
<button onclick="showTab('armas')">🗡️ Armas</button>
<button onclick="showTab('tokens')">🎟️ Tokens</button>
<button onclick="showTab('ranking')">🏆 Ranking</button>
<button onclick="showTab('editor')">⚙️ Editor</button>
</div>

<div id="frutas" class="priceTab"></div>
<div id="perm" class="priceTab" style="display:none"></div>
<div id="gamepass" class="priceTab" style="display:none"></div>
<div id="armas" class="priceTab" style="display:none"></div>
<div id="tokens" class="priceTab" style="display:none"></div>
<div id="ranking" class="priceTab" style="display:none"></div>
<div id="editor" class="priceTab" style="display:none"></div>
</div>

<!-- ================= TRADE ================= -->
<div class="card">
<h2>🔄 Você oferece</h2>
<div id="offerSlots"></div>
<input type="number" id="offerTokens" placeholder="Tokens extras" value="0">
</div>

<div class="card">
<h2>🎯 Você quer</h2>
<div id="wantSlots"></div>
<input type="number" id="wantTokens" placeholder="Tokens extras" value="0">
</div>

<button onclick="calculateTrade()">Calcular Trade</button>

<div class="tradebar"><div id="tradebar" class="tradebar-inner"></div></div>
<div id="result" class="result"></div>
<div id="diff" class="result"></div>
</div>

<script>
function showTab(tab){
['frutas','perm','gamepass','armas','tokens','ranking','editor']
.forEach(t=>document.getElementById(t).style.display='none');
document.getElementById(tab).style.display='block';
}

/* ================= BELI (VISUAL) ================= */
const beliValues={
'Flame':250000,'Light':750000,'Earth':4750000,'Time':7500000,
'Flame (Perm)':12500000,'Light (Perm)':21250000,'Earth (Perm)':37250000,'Time (Perm)':45000000,
'2x Money':2500000,'2x Maestria':2500000,'VIP':11250000,
'Tecnologic Blade':5000000,'Golden Technology Gun':3750000
};

/* ================= TOKENS (EDITÁVEL) ================= */
let tokenValues={
'Time (Perm)':90000,'Earth (Perm)':75000,'Light (Perm)':42500,'Flame (Perm)':25000,
'VIP':22500,'2x Money':5000,'2x Maestria':5000,
'Tecnologic Blade':10000,'Golden Technology Gun':7500,
'Time':15000,'Earth':9500,'Light':1500,'Flame':500
};

/* ================= RENDER ================= */
function renderTab(id,items){
document.getElementById(id).innerHTML=items.map(i=>`
<p>
<strong>${i}</strong><br>
🎟️ ${tokenValues[i]} Tokens<br>
💰 ${beliValues[i].toLocaleString()} Beli
</p>`).join('');
}

function renderAll(){
renderTab('frutas',['Flame','Light','Earth','Time']);
renderTab('perm',['Flame (Perm)','Light (Perm)','Earth (Perm)','Time (Perm)']);
renderTab('gamepass',['2x Money','2x Maestria','VIP']);
renderTab('armas',['Tecnologic Blade','Golden Technology Gun']);

document.getElementById('ranking').innerHTML=
Object.keys(tokenValues)
.sort((a,b)=>tokenValues[b]-tokenValues[a])
.map((i,n)=>`<p>#${n+1} ${i} — ${tokenValues[i]} Tokens</p>`).join('');

renderEditor();
}

document.getElementById('tokens').innerHTML=`
<p>💱 100 Tokens = 1 Robux</p>
<p>📌 Trades usam apenas TOKENS</p>
`;

/* ================= EDITOR ================= */
function renderEditor(){
document.getElementById('editor').innerHTML=
Object.keys(tokenValues).map(i=>`
<div class="editorRow">
<span>${i}</span>
<input type="number" value="${tokenValues[i]}" 
onchange="tokenValues['${i}']=+this.value;renderAll()">
</div>
`).join('');
}

/* ================= TRADE ================= */
function createSlots(id){
const c=document.getElementById(id);
c.innerHTML='';
for(let i=0;i<4;i++){
const d=document.createElement('div');
d.className='slot';
const s=document.createElement('select');
Object.keys(tokenValues).forEach(v=>s.innerHTML+=`<option>${v}</option>`);
const q=document.createElement('input');
q.type='number';q.value=0;
d.appendChild(s);d.appendChild(q);
c.appendChild(d);
}}
createSlots('offerSlots');
createSlots('wantSlots');

function calcTotal(id){
let t=0;
[...document.getElementById(id).children].forEach(s=>{
const item=s.children[0].value;
const q=+s.children[1].value;
if(q>0)t+=tokenValues[item]*q;
});
return t;
}

function calculateTrade(){
let offer=calcTotal('offerSlots') + +offerTokens.value;
let want=calcTotal('wantSlots') + +wantTokens.value;
const d=offer-want;

tradebar.style.width='50%';
tradebar.style.background='#facc15';
result.className='result';

if(Math.abs(d)<=500){
result.textContent='⚖️ TRADE JUSTA';
result.classList.add('fair');
diff.textContent='';
}else if(d>0){
result.textContent='✅ WIN';
result.classList.add('ok');
diff.textContent=`+${d} Tokens`;
tradebar.style.width='80%';
tradebar.style.background='#22c55e';
}else{
result.textContent='❌ LOSE';
result.classList.add('under');
diff.textContent=`-${Math.abs(d)} Tokens`;
tradebar.style.width='20%';
tradebar.style.background='#ef4444';
}
}

renderAll();
</script>
</body>
</html>
